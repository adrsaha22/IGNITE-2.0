<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGNITE 2.0 — Detection Rule Generator</title>
    <meta
      name="description"
      content="Generate Splunk SPL detection rules from plain-English attack descriptions."
    />
    <script>
      // Applies the stored theme before first paint so there is no flash of the
      // wrong theme. Kept inline and tiny; the React provider reads the result.
      (function () {
        try {
          var stored = localStorage.getItem('ignite.theme')
          var resolved =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
